name: zarate-saas

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Completa .env}
      MYSQL_DATABASE: zarate_dev
      MYSQL_USER: zarate
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Completa .env}
    volumes:
      - mysql_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u zarate -D zarate_dev -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file: backend/.env
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: zarate_dev
      DB_USERNAME: zarate
      DB_PASSWORD: ${MYSQL_PASSWORD:?Completa .env}
      SANCTUM_STATEFUL_DOMAINS: "${SANCTUM_STATEFUL_DOMAINS:-localhost:5173,127.0.0.1:5173,localhost,127.0.0.1,frontend:5173,frontend}"
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:80"
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    environment:
      API_PROXY_TARGET: http://nginx
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - nginx

  mysql-test:
    image: mysql:8.4.11
    profiles: ["testing"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:?Completa .env}
      MYSQL_DATABASE: zarate_test
      MYSQL_USER: zarate_test
      MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD:?Completa .env}
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u zarate_test -D zarate_test -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend-test:
    profiles: ["testing"]
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file: backend/.env.testing
    environment:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: mysql-test
      DB_PORT: 3306
      DB_DATABASE: zarate_test
      DB_USERNAME: zarate_test
      DB_PASSWORD: ${MYSQL_TEST_PASSWORD:?Completa .env}
    depends_on:
      mysql-test:
        condition: service_healthy
    command: ["sh", "-c", "php artisan migrate --force && php vendor/bin/pest"]

  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: docker/e2e/Dockerfile
    environment:
      CYPRESS_BASE_URL: http://frontend:5173
    depends_on:
      - frontend

volumes:
  mysql_dev:
  backend_vendor:
  frontend_node_modules:
